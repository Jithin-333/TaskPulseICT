{% extends "base.html" %}
{% block auth_content %}
<div style="min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center;">
  <div style="width:100%;max-width:440px;padding:1.5rem;">
    <div class="text-center mb-4">
      <div style="font-size:2rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;">⚡ TaskPulse</div>
    </div>
    <div class="tp-card">
      <h5 class="mb-4" style="font-weight:600;">Create Account</h5>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" placeholder="Your name" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" placeholder="you@company.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <div class="mb-4">
          <label class="form-label">Role</label>
          <select name="role" class="form-select">
            <option value="member">Team Member</option>
            <option value="manager">Manager</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary w-100" style="border-radius:8px;font-weight:600;padding:.65rem;">Create Account</button>
      </form>
      <div class="text-center mt-3" style="font-size:0.82rem;color:var(--text2);">
        Already have an account? <a href="{{ url_for('login') }}" style="color:var(--accent);">Sign in</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
